[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-funds-agent"
version = "0.1.0"
description = "Deterministic funds evidence review assistant for fraud cases"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.40", "python-docx>=1.1", "openpyxl>=3.1", "pypdf>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
